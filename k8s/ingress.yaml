apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fileprocessingapi
  namespace: fileprocessingapi
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"     # increase if you upload files to Blob
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"   # useful for long Service Bus operations
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - myapp.yourdomain.com
      secretName: myapp-tls          # cert-manager creates this Secret automatically
  rules:
    - host: myapp.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myapp
                port:
                  number: 80